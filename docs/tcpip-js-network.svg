<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" role="img" aria-labelledby="title description">
  <title id="title">v86 in-browser virtual network</title>
  <desc id="description">Inside one browser page, JavaScript calls virtualFetch on the tcpip.js stack at 192.168.1.1. The stack and v86 guest share a virtual Ethernet link. The guest serves HTTP at 192.168.1.2 port 8080.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1l6 3-6 3" fill="none" stroke="#35638e" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="798" height="208" rx="16" fill="#f8fafc" stroke="#d2dde7"/>
  <rect x="292" y="48" width="483" height="137" rx="13" fill="#eaf4ff" stroke="#6488ac" stroke-width="1.5" stroke-dasharray="5 5"/>

  <g font-family="system-ui, sans-serif">
    <g font-size="14" font-weight="600" fill="#40576d">
      <text x="26" y="33">Browser page</text>
      <text x="311" y="74">In-browser virtual network</text>
    </g>

    <g fill="#fff" stroke="#a9bdd1" stroke-width="1.25">
      <rect x="26" y="96" width="146" height="67" rx="9"/>
      <rect x="311" y="96" width="163" height="67" rx="9"/>
      <rect x="591" y="96" width="164" height="67" rx="9"/>
    </g>

    <g text-anchor="middle" font-size="17" font-weight="600" fill="#172d42">
      <text x="99" y="136">JavaScript</text>
      <text x="392.5" y="124">tcpip.js</text>
      <text x="673" y="124">v86 guest</text>
    </g>

    <g text-anchor="middle" font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="13" fill="#40576d">
      <text x="392.5" y="146">192.168.1.1</text>
      <text x="673" y="146">192.168.1.2:8080</text>
    </g>

    <g fill="none" stroke="#35638e" stroke-width="1.5">
      <path d="M180 132h122" marker-end="url(#arrow)"/>
      <path d="M482 132h101" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    </g>
    <g text-anchor="middle" font-size="13" fill="#314e6b">
      <text x="234" y="117" font-family="ui-monospace, DejaVu Sans Mono, monospace">virtualFetch()</text>
      <text x="532.5" y="117">Ethernet</text>
    </g>
  </g>
</svg>
